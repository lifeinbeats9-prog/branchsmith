[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "branchsmith"
version = "0.2.0"
description = "Evidence-driven software repair across Nebius Token Factory Sandbox branches using NVIDIA Nemotron."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "lifeinbeats9-prog"}]
dependencies = []

[project.optional-dependencies]
live = ["openai>=1.0", "contree-cli"]

[project.scripts]
branchsmith = "branchsmith.cli:main"

[tool.setuptools.packages.find]
include = ["branchsmith*"]
